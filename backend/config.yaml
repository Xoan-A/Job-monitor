scrapers:
  buscojobs:
    enabled: true
    rate_limit: 1.0
    params:
      country: "uy"
      api_base: "https://api.buscojobs.com/v3/uy"
      site_base: "https://www.buscojobs.com.uy"
      page_size: 15

  jooble:
    enabled: true
    rate_limit: 2.0
    params:
      api_key: "${JOOBLE_API_KEY}"
      api_base: "https://uy.jooble.org/api"
      country: "uy"
      location: "Montevideo, Uruguay"
      page_size: 20

  getonbrd:
    enabled: true
    rate_limit: 1.0
    params:
      api_base: "https://www.getonbrd.com/api/v0"
      country_code: "UY"
      lang: "en"
      page_size: 120

database:
  host: "${POSTGRES_HOST}"
  port: 5432
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  name: "${POSTGRES_DB}"
  pool_size: 5
  max_overflow: 10

scheduler:
  enabled: false
  interval_hours: 24
  default_terms:
    - "informatica"
    - "desarrollo"
    - "software"
  default_pages: 5

matching:
  weights:
    required_skills: 0.40
    preferred_skills: 0.15
    semantic: 0.20
    experience: 0.15
    role: 0.10